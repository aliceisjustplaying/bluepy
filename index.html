<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>%PHANPY_CLIENT_NAME%</title>
    <meta
      name="description"
      content="Minimalistic opinionated Bluesky web client"
    />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
      }

      #boot-status {
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: CanvasText;
      }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="%PHANPY_CLIENT_NAME%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name=""
      data-theme-setting="manual"
      content="#242526"
      data-theme-light-color="#fff"
      data-theme-light-color-temp="#ffff"
      data-theme-dark-color="#242526"
      data-theme-dark-color-temp="#242526ff"
    />
    <meta
      name="theme-color"
      data-theme-setting="auto"
      content="#fff"
      data-content="#fff"
      data-content-temp="#fffa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      data-theme-setting="auto"
      content="#242526"
      data-content="#242526"
      data-content-temp="#242526aa"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="google" content="notranslate" />
    <link rel="me" href="https://hachyderm.io/@phanpy" />
  </head>
  <body>
    <div id="app">
      <div id="boot-status">Loading Bluepy...</div>
    </div>
    <div id="modal-container"></div>
    <script>
      const BOOT_TIMEOUT_MS = 5000;
      const bootReloadKey = 'bluepy:boot-reload-attempted';
      const bootStartedAt = Date.now();
      window.__BLUEPY_BOOT_FAILED__ = false;
      const getBootStatus = () => document.getElementById('boot-status');
      const recoverStalledBoot = () => {
        const bootStatus = getBootStatus();
        if (!bootStatus || window.__BLUEPY_BOOT_FAILED__) return;
        if (Date.now() - bootStartedAt < BOOT_TIMEOUT_MS) return;
        try {
          if (sessionStorage.getItem(bootReloadKey)) return;
          sessionStorage.setItem(bootReloadKey, '1');
        } catch {
          return;
        }
        bootStatus.textContent = 'Bluepy is still loading. Reloading...';
        location.reload();
      };
      window.addEventListener('error', (event) => {
        window.__BLUEPY_BOOT_FAILED__ = true;
        const bootStatus = getBootStatus();
        if (bootStatus) {
          bootStatus.textContent = `Bluepy failed to start: ${event.message || 'unknown error'}`;
        }
      });
      window.addEventListener('unhandledrejection', (event) => {
        window.__BLUEPY_BOOT_FAILED__ = true;
        const bootStatus = getBootStatus();
        if (bootStatus) {
          bootStatus.textContent = `Bluepy failed to start: ${event.reason?.message || event.reason || 'unknown error'}`;
        }
      });
      window.addEventListener('pageshow', () => {
        setTimeout(recoverStalledBoot, 0);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          recoverStalledBoot();
        }
      });
      window.setTimeout(() => {
        const bootStatus = getBootStatus();
        if (bootStatus && !window.__BLUEPY_BOOT_FAILED__) {
          bootStatus.textContent =
            'Bluepy is still loading. If this stays here, Safari did not run the app script.';
          if (document.visibilityState === 'visible') {
            recoverStalledBoot();
          }
        }
      }, BOOT_TIMEOUT_MS);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
