<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>%PHANPY_CLIENT_NAME%</title>
    <meta
      name="description"
      content="Minimalistic opinionated Bluesky web client"
    />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
      }

      #boot-status {
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: CanvasText;
      }

      #boot-debug {
        margin-top: 16px;
        max-width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        opacity: 0.78;
      }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="%PHANPY_CLIENT_NAME%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name=""
      data-theme-setting="manual"
      content="#242526"
      data-theme-light-color="#fff"
      data-theme-light-color-temp="#ffff"
      data-theme-dark-color="#242526"
      data-theme-dark-color-temp="#242526ff"
    />
    <meta
      name="theme-color"
      data-theme-setting="auto"
      content="#fff"
      data-content="#fff"
      data-content-temp="#fffa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      data-theme-setting="auto"
      content="#242526"
      data-content="#242526"
      data-content-temp="#242526aa"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="google" content="notranslate" />
    <link rel="me" href="https://hachyderm.io/@phanpy" />
    <script>
      const BOOT_TIMEOUT_MS = 5000;
      const BOOT_MAX_RELOAD_ATTEMPTS = 3;
      const BOOT_RELOAD_PARAM = '__bluepy_boot_retry';
      const bootReloadKey = 'bluepy:boot-reload-state';
      const bootStartedAt = Date.now();
      let bootRecoveryScheduled = false;
      window.__BLUEPY_BOOT_FAILED__ = false;
      window.__BLUEPY_APP_MOUNTED__ = false;
      const getBootStatus = () => document.getElementById('boot-status');
      const bootDebugEvents = [];
      const renderBootDebug = () => {
        const bootStatus = getBootStatus();
        if (!bootStatus) return;
        let bootDebug = document.getElementById('boot-debug');
        if (!bootDebug) {
          bootDebug = document.createElement('pre');
          bootDebug.id = 'boot-debug';
          bootStatus.append(bootDebug);
        }
        bootDebug.textContent = bootDebugEvents.join('\n');
      };
      const markBoot = (label, detail = '') => {
        const elapsed = String(Date.now() - bootStartedAt).padStart(5, ' ');
        const state = document.visibilityState || 'unknown';
        const line = `${elapsed}ms ${label}${detail ? ` ${detail}` : ''} [${state}]`;
        bootDebugEvents.push(line);
        if (bootDebugEvents.length > 24) bootDebugEvents.shift();
        renderBootDebug();
      };
      window.__BLUEPY_BOOT_MARK__ = markBoot;
      markBoot('head-script');
      const getBootReloadState = () => {
        const rawState = sessionStorage.getItem(bootReloadKey);
        if (rawState) {
          try {
            const state = JSON.parse(rawState);
            return {
              attempts: Number(state.attempts || 0),
              lastAt: Number(state.lastAt || 0),
            };
          } catch {}
        }
        return { attempts: 0, lastAt: 0 };
      };
      const isBootResourceError = (event) => {
        const target = event.target;
        if (target instanceof HTMLScriptElement) {
          return target.type === 'module';
        }
        if (target instanceof HTMLLinkElement) {
          return target.rel === 'modulepreload';
        }
        return false;
      };
      const recoverStalledBoot = (reason = 'timeout') => {
        markBoot('recover-check', reason);
        const bootStatus = getBootStatus();
        if (!bootStatus && reason === 'timeout') {
          markBoot('recover-skip', 'no-boot-status');
          return;
        }
        if (window.__BLUEPY_APP_MOUNTED__ || bootRecoveryScheduled) {
          markBoot('recover-skip', 'mounted-or-scheduled');
          return;
        }
        if (window.__BLUEPY_BOOT_FAILED__) {
          markBoot('recover-skip', 'boot-failed');
          return;
        }
        const now = Date.now();
        if (reason === 'timeout' && now - bootStartedAt < BOOT_TIMEOUT_MS) {
          markBoot('recover-skip', 'too-early');
          return;
        }
        try {
          const state = getBootReloadState();
          const attempts = state.attempts;
          if (attempts >= BOOT_MAX_RELOAD_ATTEMPTS) {
            markBoot('recover-skip', `max-attempts=${attempts}`);
            return;
          }
          sessionStorage.setItem(
            bootReloadKey,
            JSON.stringify({ attempts: attempts + 1, lastAt: now }),
          );
          markBoot('recover-reload', `attempt=${attempts + 1}`);
        } catch {
          markBoot('recover-skip', 'session-storage-error');
          return;
        }
        bootRecoveryScheduled = true;
        if (bootStatus) {
          bootStatus.textContent = 'Bluepy is still loading. Reloading...';
        }
        const nextURL = new URL(location.href);
        nextURL.searchParams.set(BOOT_RELOAD_PARAM, String(now));
        location.replace(nextURL.href);
      };
      window.addEventListener(
        'error',
        (event) => {
          if (isBootResourceError(event)) {
            const target = event.target;
            markBoot(
              'resource-error',
              target?.src || target?.href || target?.tagName || '',
            );
            recoverStalledBoot('resource-error');
            return;
          }
          if (event.target && event.target !== window) return;
          markBoot('runtime-error', event.message || 'unknown');
          window.__BLUEPY_BOOT_FAILED__ = true;
          const bootStatus = getBootStatus();
          if (bootStatus) {
            bootStatus.textContent = `Bluepy failed to start: ${event.message || 'unknown error'}`;
            renderBootDebug();
          }
        },
        true,
      );
      window.addEventListener('unhandledrejection', (event) => {
        markBoot(
          'unhandled-rejection',
          event.reason?.message || event.reason || 'unknown',
        );
        window.__BLUEPY_BOOT_FAILED__ = true;
        const bootStatus = getBootStatus();
        if (bootStatus) {
          bootStatus.textContent = `Bluepy failed to start: ${event.reason?.message || event.reason || 'unknown error'}`;
          renderBootDebug();
        }
      });
      window.addEventListener('pageshow', () => {
        markBoot('pageshow');
        setTimeout(recoverStalledBoot, 0);
      });
      window.addEventListener('load', () => {
        markBoot('window-load');
      });
      document.addEventListener('DOMContentLoaded', () => {
        markBoot('dom-content-loaded');
      });
      document.addEventListener('visibilitychange', () => {
        markBoot('visibilitychange');
        if (document.visibilityState === 'visible') {
          recoverStalledBoot();
        }
      });
      window.setTimeout(() => {
        markBoot('timeout');
        const bootStatus = getBootStatus();
        if (bootStatus && !window.__BLUEPY_BOOT_FAILED__) {
          bootStatus.textContent =
            'Bluepy is still loading. If this stays here, Safari did not run the app script.';
          renderBootDebug();
          if (document.visibilityState === 'visible') {
            recoverStalledBoot();
          }
        }
      }, BOOT_TIMEOUT_MS);
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot-status">Loading Bluepy...</div>
    </div>
    <div id="modal-container"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
